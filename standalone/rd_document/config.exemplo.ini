; ==================================================================
;  Relatório de Receitas - Escriba Document
;  Arquivo de configuração
; ==================================================================
;
;  Preencha a seção [banco] com os dados de acesso ao servidor do
;  Escriba. As demais seções já vêm preenchidas e só devem ser
;  alteradas com orientação do setor contábil ou da TI.
;
;  Linhas que começam com ";" são comentários e são ignoradas.

[banco]
; Endereço (IP ou nome) do servidor MySQL do Escriba.
host =
; Porta do servidor (normalmente 3306).
porta = 3306
; Usuário e senha de acesso ao banco.
usuario =
senha =

[saida]
; Pasta onde o relatório (TXT) será gravado.
; Deixe em branco para gravar na mesma pasta deste arquivo.
pasta =

[contas]
; Contas contábeis usadas nos lançamentos (7 dígitos).
caixa = 1000001
servico = 9010001
devolucao = 9300008
deposito_previo = 1010001
emolumento = 1010002

[prefixos]
; Prefixo do campo "documento" por tipo de processo (2 dígitos).
; Só identifica a origem do lançamento, sem valor contábil.
; 1º dígito = natureza: 9 ato, 8 certidão, 7 exame, 6 despesa.
; Os prefixos 99, 88, 77 e 66 são do Registro de Imóveis (AFINCO).
TD = 98
PJ = 97
MT = 95
LV = 94
AP = 93
IR = 92
CT = 87
EX = 76

[siglas]
; Sigla usada no histórico quando for diferente do tipo do processo.
; EX vira ED porque EX já é o exame do Registro de Imóveis no AFINCO.
EX = ED
