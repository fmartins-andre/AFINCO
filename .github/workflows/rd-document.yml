# Empacota o relatório standalone do Escriba Document (standalone/rd_document)
# para Windows e Linux. Em tags rd-document-v*, publica os pacotes numa Release.
name: rd-document

on:
  push:
    tags: ['rd-document-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # ubuntu-22.04: glibc mais antiga, o binário roda em mais distribuições
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: standalone/rd_document
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -c "import tkinter"
          pip install pymysql==1.1.1 pyinstaller==6.11.1

      - name: Empacotar
        run: python empacotar.py ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - uses: actions/upload-artifact@v4
        with:
          name: pacote-${{ matrix.os }}
          path: |
            standalone/rd_document/dist/*.zip
            standalone/rd_document/dist/*.tar.gz

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Relatório de Receitas (Document) ${{ github.ref_name }}
          files: pacotes/*
